name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make fmt-check
      - run: make tidy-check
      - run: go vet ./...
      - run: make bench-smoke

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...

  cross-build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build both commands
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p tmp/cross
          go build -trimpath -o "tmp/cross/ejquick-${GOOS}-${GOARCH}" ./cmd/ejquick
          go build -trimpath -o "tmp/cross/ejquick-build-${GOOS}-${GOARCH}" ./cmd/ejquick-build

  gui:
    name: GUI (Ubuntu 24.04 / Qt 6.11.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Qt 6.11.2
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: 6.11.2
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: ${{ runner.temp }}/qt
          modules: qtwaylandcompositor
          install-deps: true
          cache: true
          cache-key-prefix: ejquick-qt
          # Qt 6.11 changed the online SDK directory layout. Pin aqtinstall
          # to the upstream commit that added support for that layout.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74

      - name: Install Wayland test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y weston wayland-protocols

      - name: Verify Qt installation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${QT_ROOT_DIR:-}"
          test -d "$QT_ROOT_DIR"
          test -f "$QT_ROOT_DIR/lib/pkgconfig/Qt6Widgets.pc"
          test -f "$QT_ROOT_DIR/plugins/platforms/libqwayland.so"
          test "$(PKG_CONFIG_PATH="$QT_ROOT_DIR/lib/pkgconfig" pkg-config --modversion Qt6Core)" = "6.11.2"
          test "$(PKG_CONFIG_PATH="$QT_ROOT_DIR/lib/pkgconfig" pkg-config --modversion Qt6Gui)" = "6.11.2"
          test "$(PKG_CONFIG_PATH="$QT_ROOT_DIR/lib/pkgconfig" pkg-config --modversion Qt6Widgets)" = "6.11.2"
          qmake6 --version || true

      - name: Build GUI
        run: |
          go clean -cache
          make build-gui \
            QT_PREFIX="$QT_ROOT_DIR" \
            QT_PKG_CONFIG_PATH="$QT_ROOT_DIR/lib/pkgconfig"

      - name: Test GUI packages
        run: |
          make test-gui \
            QT_PREFIX="$QT_ROOT_DIR" \
            QT_PKG_CONFIG_PATH="$QT_ROOT_DIR/lib/pkgconfig"

      - name: Vet GUI packages
        run: |
          make vet-gui \
            QT_PREFIX="$QT_ROOT_DIR" \
            QT_PKG_CONFIG_PATH="$QT_ROOT_DIR/lib/pkgconfig"

      - name: Create synthetic GUI database
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="${GITHUB_WORKSPACE}/tmp/gui-smoke"
          mkdir -p "$smoke_dir"
          printf '\x81\xa1ejquick-smoke : artificial GUI smoke entry\r\n' \
            > "$smoke_dir/EIJIRO1-0.TXT"
          tmp/ejquick-build \
            --type eiwa \
            --output "$smoke_dir/eiwa.sqlite3" \
            "$smoke_dir/EIJIRO1-0.TXT"
          cat > "$smoke_dir/config.toml" <<'EOF'
          [eiwa]
          database = "eiwa.sqlite3"

          [waei]
          database = "missing-waei.sqlite3"

          [search]
          default_dictionary = "eiwa"
          max_results = 50
          EOF

      - name: Run Weston Wayland smoke test
        run: |
          packaging/linux/test-wayland.sh \
            tmp/ejquick-gui \
            tmp/gui-smoke/config.toml \
            tmp/gui-smoke

  gui-package:
    name: GUI package (Rocky Linux 9.6 / Qt 6.11.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: rockylinux/rockylinux@sha256:91bbb8eb52ca462611c1f9ce5c4cede4172a31bfe64f336e82f29648694a3cfe
    env:
      AQT_COMMIT: 8c3695d4a4e1ceabf6a74dc6c79681656dc6b74
      FCITX5_QT_COMMIT: 272b6b9eba97f0ed97e8a5caaf0bb22c6123f462
      FCITX5_QT_VERSION: 5.1.15
      ICU_VERSION: "73.2"
      QT_VERSION: 6.11.2
      ROCKY_IMAGE: rockylinux/rockylinux@sha256:91bbb8eb52ca462611c1f9ce5c4cede4172a31bfe64f336e82f29648694a3cfe
      SYSTEM_PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Install system build dependencies
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y epel-release
          dnf upgrade -y coreutils-single
          dnf swap -y coreutils-single coreutils
          dnf install -y \
            alsa-lib \
            binutils \
            cmake \
            dbus-libs \
            extra-cmake-modules \
            findutils \
            fontconfig \
            freetype \
            gcc \
            gcc-c++ \
            git \
            glib2 \
            libICE \
            libSM \
            libX11 \
            libX11-xcb \
            libXext \
            libXrender \
            libglvnd-devel \
            libglvnd-egl \
            libglvnd-glx \
            libxcb \
            libxkbcommon \
            libxkbcommon-devel \
            make \
            mesa-libGL \
            ninja-build \
            openssl-libs \
            patch \
            pkgconf-pkg-config \
            python3.12 \
            python3.12-pip \
            tar \
            wayland-devel \
            xcb-util \
            xcb-util-cursor \
            xcb-util-image \
            xcb-util-keysyms \
            xcb-util-renderutil \
            xcb-util-wm \
            zlib \
            zstd
          command -v basename dirname sha256sum uname

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify fixed baseline
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          export PATH="$SYSTEM_PATH:$PATH"
          test "$(uname -m)" = x86_64
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.34"
          test "$(go env GOVERSION)" = "go1.27.1"
          [[ $(python3.12 --version) == Python\ 3.12.* ]]
          test "$(go list -m -f '{{.Version}}' github.com/mappu/miqt)" = "v0.14.0"

      - name: Install Qt 6.11.2
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          export PATH="$SYSTEM_PATH:$PATH"
          python_bin=python3.12
          "$python_bin" -m pip install "git+https://github.com/miurahr/aqtinstall.git@${AQT_COMMIT}"
          cd "$RUNNER_TEMP"
          "$python_bin" -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 \
            --outputdir "$RUNNER_TEMP/Qt" \
            --modules qtwaylandcompositor
          qt_root="$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64"
          qtpaths_bin=
          for candidate in "$qt_root/bin/qtpaths6" "$qt_root/bin/qtpaths"; do
            if [[ -x $candidate ]]; then
              qtpaths_bin=$candidate
              break
            fi
          done
          test -n "$qtpaths_bin"
          test -f "$qt_root/lib/pkgconfig/Qt6Widgets.pc"
          test -f "$qt_root/plugins/platforms/libqwayland.so"
          {
            echo "QT_ROOT_DIR=$qt_root"
            echo "QT_PATHS=$qtpaths_bin"
            echo "PATH=$qt_root/bin:$PATH"
            echo "LD_LIBRARY_PATH=$qt_root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            echo "PKG_CONFIG_PATH=$qt_root/lib/pkgconfig"
          } >> "$GITHUB_ENV"

      - name: Verify Qt installation
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          export PATH="$SYSTEM_PATH:$PATH"
          test "$(pkg-config --modversion Qt6Core)" = "$QT_VERSION"
          test "$(pkg-config --modversion Qt6Gui)" = "$QT_VERSION"
          test "$(pkg-config --modversion Qt6Widgets)" = "$QT_VERSION"
          test "$("$QT_PATHS" -query QT_VERSION)" = "$QT_VERSION"

      - name: Build Fcitx5 Qt input context plugin
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          export PATH="$SYSTEM_PATH:$PATH"
          source_dir="$RUNNER_TEMP/fcitx5-qt"
          build_dir="$RUNNER_TEMP/fcitx5-qt-build"
          install_dir="$RUNNER_TEMP/fcitx5-qt-install"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/fcitx/fcitx5-qt.git
          git -C "$source_dir" fetch --depth 1 origin "$FCITX5_QT_COMMIT"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$FCITX5_QT_COMMIT"
          grep -Fq "project(fcitx5-qt VERSION $FCITX5_QT_VERSION)" "$source_dir/CMakeLists.txt"
          cmake -S "$source_dir" -B "$build_dir" -G Ninja \
            -DBUILD_ONLY_PLUGIN=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$install_dir" \
            -DCMAKE_INSTALL_QT6PLUGINDIR="$install_dir/lib/qt6/plugins" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_SKIP_RPATH=ON \
            -DENABLE_QT4=OFF \
            -DENABLE_QT5=OFF \
            -DENABLE_QT6=ON \
            -DENABLE_QT6_WAYLAND_WORKAROUND=ON \
            -DENABLE_X11=OFF
          cmake --build "$build_dir" --parallel 2
          cmake --install "$build_dir" --prefix "$install_dir"
          plugin=$(find "$install_dir" -type f -name libfcitx5platforminputcontextplugin.so -print -quit)
          test -n "$plugin"
          mkdir -p "$install_dir/lib"
          {
            echo "FCITX5_PLUGIN=$plugin"
            echo "FCITX5_LIBDIR=$install_dir/lib"
            echo "FCITX5_LICENSES_DIR=$source_dir/LICENSES"
            echo "FCITX5_QT_SOURCE_REV=$(git -C "$source_dir" rev-parse HEAD)"
          } >> "$GITHUB_ENV"

      - name: Collect runtime license material
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          export PATH="$SYSTEM_PATH:$PATH"
          license_root="$RUNNER_TEMP/runtime-licenses"
          mkdir -p "$license_root/Qt"
          git clone --depth 1 --branch "v$QT_VERSION" --filter=blob:none --sparse \
            https://github.com/qt/qtbase.git "$license_root/qtbase-source"
          git -C "$license_root/qtbase-source" sparse-checkout set LICENSES
          git clone --depth 1 --branch "v$QT_VERSION" --filter=blob:none --sparse \
            https://github.com/qt/qtwayland.git "$license_root/qtwayland-source"
          git -C "$license_root/qtwayland-source" sparse-checkout set LICENSES
          git clone --depth 1 --branch release-73-2 --filter=blob:none --sparse \
            https://github.com/unicode-org/icu.git "$license_root/icu-source"
          git -C "$license_root/icu-source" sparse-checkout set --no-cone icu4c/LICENSE
          cp -a "$license_root/qtbase-source/LICENSES" "$license_root/Qt/qtbase"
          cp -a "$license_root/qtwayland-source/LICENSES" "$license_root/Qt/qtwayland"
          test -f "$license_root/Qt/qtbase/LGPL-3.0-only.txt"
          test -f "$license_root/Qt/qtbase/GPL-3.0-only.txt"
          test -f "$FCITX5_LICENSES_DIR/LGPL-2.1-or-later.txt"
          test -s "$license_root/icu-source/icu4c/LICENSE"
          {
            echo "QT_LICENSES_DIR=$license_root/Qt"
            echo "ICU_LICENSE_FILE=$license_root/icu-source/icu4c/LICENSE"
            echo "QTBASE_SOURCE_REV=$(git -C "$license_root/qtbase-source" rev-parse HEAD)"
            echo "QTWAYLAND_SOURCE_REV=$(git -C "$license_root/qtwayland-source" rev-parse HEAD)"
            echo "ICU_SOURCE_REV=$(git -C "$license_root/icu-source" rev-parse HEAD)"
          } >> "$GITHUB_ENV"

      - name: Build Linux GUI package
        id: package
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          export PATH="$SYSTEM_PATH:$PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(git describe --tags --always --dirty)
          [[ $version != *-dirty ]]
          make package-gui-linux \
            VERSION="$version" \
            QT_PREFIX="$QT_ROOT_DIR" \
            QT_PKG_CONFIG_PATH="$QT_ROOT_DIR/lib/pkgconfig" \
            FCITX5_PLUGIN="$FCITX5_PLUGIN" \
            FCITX5_LIBDIR="$FCITX5_LIBDIR" \
            QT_LICENSES_DIR="$QT_LICENSES_DIR" \
            FCITX5_LICENSES_DIR="$FCITX5_LICENSES_DIR" \
            ICU_LICENSE_FILE="$ICU_LICENSE_FILE" \
            ICU_VERSION="$ICU_VERSION" \
            QTBASE_SOURCE_REV="$QTBASE_SOURCE_REV" \
            QTWAYLAND_SOURCE_REV="$QTWAYLAND_SOURCE_REV" \
            FCITX5_QT_SOURCE_REV="$FCITX5_QT_SOURCE_REV" \
            ICU_SOURCE_REV="$ICU_SOURCE_REV"
          archive="$GITHUB_WORKSPACE/tmp/dist/ejquick-gui_${version}_linux_amd64.tar.zst"
          test -f "$archive"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Verify Linux GUI package
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          export PATH="$SYSTEM_PATH:$PATH"
          make verify-gui-package \
            VERSION="${{ steps.package.outputs.version }}" \
            GUI_PACKAGE="${{ steps.package.outputs.archive }}"

      - name: Record build metadata and checksum
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          export PATH="$SYSTEM_PATH:$PATH"
          archive="${{ steps.package.outputs.archive }}"
          archive_dir=$(dirname -- "$archive")
          archive_name=$(basename -- "$archive")
          (cd "$archive_dir" && sha256sum "$archive_name") > "$archive.sha256"
          {
            echo "version=${{ steps.package.outputs.version }}"
            echo "commit=$GITHUB_SHA"
            echo "build_image=$ROCKY_IMAGE"
            echo "glibc=$(getconf GNU_LIBC_VERSION)"
            echo "go=$(go env GOVERSION)"
            echo "python=$(python3.12 --version | awk '{print $2}')"
            echo "qt=$QT_VERSION"
            echo "aqtinstall_commit=$AQT_COMMIT"
            echo "miqt=$(go list -m -f '{{.Version}}' github.com/mappu/miqt)"
            echo "fcitx5_qt=$FCITX5_QT_VERSION"
            echo "fcitx5_qt_commit=$FCITX5_QT_COMMIT"
            echo "qtbase_source_commit=$QTBASE_SOURCE_REV"
            echo "qtwayland_source_commit=$QTWAYLAND_SOURCE_REV"
            echo "icu=$ICU_VERSION"
            echo "icu_source_commit=$ICU_SOURCE_REV"
            echo "compiler=$(gcc -dumpfullversion -dumpversion)"
          } > "$archive.build-info.txt"

      - name: Upload Linux GUI package
        uses: actions/upload-artifact@v6
        with:
          name: ejquick-gui-linux-amd64-${{ steps.package.outputs.version }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
            ${{ steps.package.outputs.archive }}.build-info.txt
          if-no-files-found: error
          retention-days: 14
