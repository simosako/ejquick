name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make fmt-check
      - run: make tidy-check
      - run: go vet ./...
      - run: make bench-smoke

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...

  cross-build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build both commands
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p tmp/cross
          go build -trimpath -o "tmp/cross/ejquick-${GOOS}-${GOARCH}" ./cmd/ejquick
          go build -trimpath -o "tmp/cross/ejquick-build-${GOOS}-${GOARCH}" ./cmd/ejquick-build

  gui:
    name: GUI (Ubuntu 24.04 / Qt 6.11.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Qt 6.11.2
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: 6.11.2
          host: linux
          target: desktop
          arch: gcc_64
          dir: ${{ runner.temp }}/qt
          modules: qtwaylandcompositor
          install-deps: true
          cache: true
          cache-key-prefix: ejquick-qt
          # Qt 6.11 changed the online SDK directory layout. Pin aqtinstall
          # to the upstream commit that added support for that layout.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74

      - name: Install Wayland test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y weston wayland-protocols

      - name: Verify Qt installation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${QT_ROOT_DIR:-}"
          test -d "$QT_ROOT_DIR"
          test -f "$QT_ROOT_DIR/lib/pkgconfig/Qt6Widgets.pc"
          test -f "$QT_ROOT_DIR/plugins/platforms/libqwayland.so"
          test "$(PKG_CONFIG_PATH="$QT_ROOT_DIR/lib/pkgconfig" pkg-config --modversion Qt6Core)" = "6.11.2"
          test "$(PKG_CONFIG_PATH="$QT_ROOT_DIR/lib/pkgconfig" pkg-config --modversion Qt6Gui)" = "6.11.2"
          test "$(PKG_CONFIG_PATH="$QT_ROOT_DIR/lib/pkgconfig" pkg-config --modversion Qt6Widgets)" = "6.11.2"
          qmake6 --version || true

      - name: Build GUI
        run: |
          go clean -cache
          make build-gui \
            QT_PREFIX="$QT_ROOT_DIR" \
            QT_PKG_CONFIG_PATH="$QT_ROOT_DIR/lib/pkgconfig"

      - name: Test GUI packages
        run: |
          make test-gui \
            QT_PREFIX="$QT_ROOT_DIR" \
            QT_PKG_CONFIG_PATH="$QT_ROOT_DIR/lib/pkgconfig"

      - name: Vet GUI packages
        run: |
          make vet-gui \
            QT_PREFIX="$QT_ROOT_DIR" \
            QT_PKG_CONFIG_PATH="$QT_ROOT_DIR/lib/pkgconfig"
