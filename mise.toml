[tasks.release]
description = "Create and push an annotated release tag"
interactive = true
run = '''
#!/usr/bin/env bash
set -euo pipefail

repo_root="$(git rev-parse --show-toplevel 2>/dev/null)" || {
  echo "This task must be run inside the EJQuick Git repository." >&2
  exit 1
}
cd "$repo_root"

if [[ -n "$(git status --porcelain)" ]]; then
  echo "The working tree is not clean. Commit or stash changes before releasing." >&2
  exit 1
fi

if ! git remote get-url origin >/dev/null 2>&1; then
  echo "The Git remote 'origin' is not configured." >&2
  exit 1
fi

read -r -p "Release version (for example, v0.1.0): " version
if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
  echo "Invalid version: use a version such as v0.1.0 or v0.2.0-rc.1." >&2
  exit 1
fi

if git rev-parse --verify --quiet "refs/tags/$version" >/dev/null; then
  echo "The tag '$version' already exists." >&2
  exit 1
fi

echo "Creating and pushing tag '$version' from $(git rev-parse --short HEAD) to origin."
read -r -p "Continue? [y/N] " answer
if [[ ! "$answer" =~ ^[Yy]$ ]]; then
  echo "Release cancelled."
  exit 0
fi

git tag -a "$version" -m "EJQuick $version"
git push origin "$version"
echo "Release tag '$version' was pushed successfully."
'''
